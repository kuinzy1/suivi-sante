async function all(tb,o){let out=[],from=0;for(;;){const {data,error}=await sb.from(tb).select('*').order(o).range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)return out;from+=1000}}
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{if(s?.user?.id!==S.user?.id)boot(s)});
  await boot(session);
}
async function boot(session){
  S.user=session?.user||null;
  if(!S.user){S.profile=null;return renderLogin()}
  try{await loadAll();S.anim=1;render()}
  catch(e){$('#app').innerHTML=`<main><div class="card"><h2>Error</h2><p>${esc(e.message)}</p><button onclick="sb.auth.signOut()">${t('logout')}</button></div></main>`}
}
async function loadAll(){
  const [p,g]=await Promise.all([
    sb.from('profiles').select('*').eq('id',S.user.id).single(),
    sb.from('goals').select('*').eq('active',true).order('created_at',{ascending:false}).limit(1)]);
  if(p.error)throw p.error;
  S.profile=p.data;S.goal=g.data?.[0]||null;
  [S.w,S.r,S.ex,S.mt,S.bm,S.wo,S.ws,S.cy]=await Promise.all([
    all('body_entries','entry_date'),all('runs','run_date'),all('exercises','name'),all('measurement_types','name'),
    all('body_measurements','id'),all('workouts','workout_date'),all('workout_sets','id'),all('cycle_entries','entry_date')]);
  if(!S.ex.find(e=>e.id===S.chartEx))S.chartEx=S.ex[0]?.id||null;
  if(!S.mt.find(e=>e.id===S.chartMt))S.chartMt=S.mt[0]?.id||null;
}

  return L.map(e=>{const win=L.filter(x=>x.entry_date<=e.entry_date&&dayDiff(e.entry_date,x.entry_date)<7);return{d:e.entry_date,v:+e.weight_kg,m:win.reduce((a,x)=>a+ +x.weight_kg,0)/win.length}});

function weekStart(ds){const x=new Date(ds+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x.toISOString().slice(0,10)}
function weeklyKm(){const m={};S.r.forEach(r=>{const k=weekStart(r.run_date);m[k]=(m[k]||0)+ +r.distance_km});return m}
function drawWeight(id){

  mk(id,{type:'line',data:{labels:a.map(x=>x.d),datasets:ds},options:CL});
}
function drawWeekly(id){

function drawMeasure(){

function drawEx(){
  const ex=S.ex.find(e=>e.id===S.chartEx);if(!ex)return;
  const wd=Object.fromEntries(S.wo.map(w=>[w.id,w.workout_date])),by={};
  S.ws.filter(s=>s.exercise_id===ex.id&&wd[s.workout_id]).forEach(s=>{
    const d=wd[s.workout_id],v=ex.kind==='weight'?+s.weight_kg||0:ex.kind==='bodyweight'?+s.reps||0:+s.duration_s||0;by[d]=Math.max(by[d]||0,v)});
  const k=Object.keys(by).sort();if(!k.length)return;
  mk('c3',{type:'line',data:{labels:k,datasets:[{data:k.map(d=>+(ex.kind==='weight'?kgOut(by[d]):by[d]).toFixed(1)),borderColor:ACC,tension:.25}]},options:CO});
}
function cycleInfo(){
  const st=S.cy.filter(c=>c.period_start).map(c=>c.entry_date).sort(),L=[];
  for(let i=1;i<st.length;i++){const d=dayDiff(st[i],st[i-1]);if(d>=15&&d<=60)L.push(d)}
  const l6=L.slice(-6),avg=l6.length?l6.reduce((a,b)=>a+b,0)/l6.length:null,last=st[st.length-1]||null;
  return{last,avg,next:avg&&last?addDays(last,Math.round(avg)):null,day:last?dayDiff(today(),last)+1:null};
}
function drawCycle(){
  const L=S.cy.filter(c=>c.mood||c.energy).slice(-60);if(!L.length)return;
  mk('c4',{type:'line',data:{labels:L.map(c=>c.entry_date),datasets:[
    {label:t('mood'),data:L.map(c=>c.mood),borderColor:'#d99a2b',tension:.3,spanGaps:true},
    {label:t('energy'),data:L.map(c=>c.energy),borderColor:ACC,tension:.3,spanGaps:true}]},options:{...CL,scales:{...CL.scales,y:{min:1,max:5,ticks:{stepSize:1}}}}});
}
function summary(days){
  const from=addDays(today(),-(days-1)),inR=d=>d>=from&&d<=today();
  const wo=S.wo.filter(w=>inR(w.workout_date)),rn=S.r.filter(r=>inR(r.run_date)),ids=new Set(wo.map(w=>w.id));
  const vol=S.ws.filter(s=>ids.has(s.workout_id)).reduce((a,s)=>a+(+s.reps||0)*(+s.weight_kg||0),0);
  const km=rn.reduce((a,r)=>a+ +r.distance_km,0);
  const we=S.w.filter(e=>e.weight_kg!=null&&inR(e.entry_date));
  const dw=we.length>=2?+we[we.length-1].weight_kg- +we[0].weight_kg:null;
  const sessions=wo.length+rn.length,target=(S.profile.modules?.target_sessions||3)*days/7;
  const score=Math.round(70*Math.min(1,sessions/target)+30*Math.min(1,we.length/(3*days/7)));
  return{sessions,km,vol,dw,score};
}

async function refresh(){await loadAll();render()}
async function saveBody(e){
  e.preventDefault();
  const row={user_id:S.user.id,entry_date:$('#wd').value};
  if($('#wv').value)row.weight_kg=+kgIn(+$('#wv').value).toFixed(2);
  if($('#wf').value)row.body_fat_pct=+$('#wf').value;
  const ms=[...document.querySelectorAll('.mi')].filter(i=>i.value);
  if(!row.weight_kg&&!row.body_fat_pct&&!ms.length)return flash(t('noData'));
  const {data,error}=await sb.from('body_entries').upsert(row,{onConflict:'user_id,entry_date'}).select().single();
  if(error)return flash(error.message);
  for(const i of ms){
    await sb.from('body_measurements').delete().eq('entry_id',data.id).eq('type_id',i.dataset.id);
    const r=await sb.from('body_measurements').insert({user_id:S.user.id,entry_id:data.id,type_id:i.dataset.id,value_cm:+cmIn(+i.value).toFixed(2)});
    if(r.error)return flash(r.error.message);
  }
  await refresh();flash(t('saved'));return false;
}

async function saveWorkout(e){
  e.preventDefault();
  if(!S.draft.length)return flash(t('addSetFirst'));
  const exm=Object.fromEntries(S.ex.map(x=>[x.id,x])),prs=[];
  for(const id of new Set(S.draft.map(s=>s.ex))){
    const ex=exm[id],f=s=>ex.kind==='weight'?+s.weight_kg||0:ex.kind==='bodyweight'?+s.reps||0:+s.duration_s||0;
    const prev=Math.max(0,...S.ws.filter(s=>s.exercise_id===id).map(f));
    const now=Math.max(0,...S.draft.filter(s=>s.ex===id).map(s=>ex.kind==='weight'?+s.w||0:+s.reps||0));
    if(prev>0&&now>prev)prs.push(ex.name);
  }
  const {data:w,error}=await sb.from('workouts').insert({user_id:S.user.id,workout_date:$('#xd').value,location:$('#xl').value,title:$('#xt').value||null,duration_min:$('#xm').value?+$('#xm').value:null}).select().single();
  if(error)return flash(error.message);
  const cnt={};
  const sets=S.draft.map(s=>{const k=exm[s.ex].kind;cnt[s.ex]=(cnt[s.ex]||0)+1;
    return{user_id:S.user.id,workout_id:w.id,exercise_id:s.ex,set_number:cnt[s.ex],reps:k==='duration'?null:s.reps,weight_kg:k==='weight'?s.w:null,duration_s:k==='duration'?s.reps:null,rpe:s.rpe}});
  const r=await sb.from('workout_sets').insert(sets);
  if(r.error)return flash(r.error.message);
  S.draft=[];await refresh();
  flash(prs.length?t('prMsg')+prs.join(', '):t('saved'));return false;
}
async function saveCycle(e){
  e.preventDefault();
  const row={user_id:S.user.id,entry_date:$('#cd').value,period_start:$('#cps').checked,period_end:$('#cpe').checked,flow:$('#cf').value||null,

  const {error}=await sb.from('cycle_entries').upsert(row,{onConflict:'user_id,entry_date'});
  if(error)return flash(error.message);
  await refresh();flash(t('saved'));return false;
}
async function saveProfile(e){
  e.preventDefault();
  const modules={...(S.profile.modules||{}),gym:$('#mg').checked,running:$('#mr').checked,cycle:$('#mc').checked,target_sessions:+$('#ts').value||3};
  const {error}=await sb.from('profiles').update({display_name:$('#sn').value,language:$('#sl').value,weight_unit:$('#sw').value,distance_unit:$('#sd').value,length_unit:$('#su').value,theme:$('#st').value,modules}).eq('id',S.user.id);

}
async function saveGoal(e){
  e.preventDefault();
  const last=S.w.filter(x=>x.weight_kg!=null).pop();
  await sb.from('goals').update({active:false}).eq('user_id',S.user.id).eq('active',true);
  const {error}=await sb.from('goals').insert({user_id:S.user.id,type:$('#gt').value,start_weight_kg:last?last.weight_kg:null,target_weight_kg:$('#gw').value?+kgIn(+$('#gw').value).toFixed(2):null,target_date:$('#gd').value||null,active:true});

async function savePwd(e){
  e.preventDefault();
  const {error}=await sb.auth.updateUser({password:$('#np').value});
  flash(error?error.message:t('pwdok'),'pm');return false;

function exportXlsx(){
  const wb=XLSX.utils.book_new(),add=(n,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),n);
  const ed=Object.fromEntries(S.w.map(e=>[e.id,e.entry_date])),tn=Object.fromEntries(S.mt.map(x=>[x.id,x.name]));
  const wd=Object.fromEntries(S.wo.map(w=>[w.id,w])),en=Object.fromEntries(S.ex.map(x=>[x.id,x.name]));
  add('weight',S.w.map(e=>({date:e.entry_date,weight_kg:e.weight_kg,body_fat_pct:e.body_fat_pct})));
  add('measures',S.bm.filter(b=>ed[b.entry_id]).map(b=>({date:ed[b.entry_id],name:tn[b.type_id],value_cm:b.value_cm})));
  add('runs',S.r.map(r=>({date:r.run_date,distance_km:r.distance_km,duration_min:+(r.duration_s/60).toFixed(2)})));
  add('workouts',S.ws.filter(s=>wd[s.workout_id]).map(s=>({date:wd[s.workout_id].workout_date,location:wd[s.workout_id].location,title:wd[s.workout_id].title||'',exercise:en[s.exercise_id],set:s.set_number,reps:s.reps??s.duration_s,weight_kg:s.weight_kg,rpe:s.rpe})));
  add('cycle',S.cy.map(c=>({date:c.entry_date,period_start:c.period_start,period_end:c.period_end,flow:c.flow,mood:c.mood,energy:c.energy,symptoms:(c.symptoms||[]).join(', '),notes:c.notes})));
  XLSX.writeFile(wb,'suivi-sante-'+today()+'.xlsx');
}
async function importXlsx(inp){
  const f=inp.files[0];if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer()),uid=S.user.id;let n=0;
    const rows=k=>wb.Sheets[k]?XLSX.utils.sheet_to_json(wb.Sheets[k],{raw:false}):[];
    const ok=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||''),chk=r=>{if(r.error)throw r.error;return r.data};
    const W=rows('weight').filter(r=>ok(r.date)&&r.weight_kg).map(r=>({user_id:uid,entry_date:r.date,weight_kg:+r.weight_kg,body_fat_pct:r.body_fat_pct?+r.body_fat_pct:null}));
    if(W.length){chk(await sb.from('body_entries').upsert(W,{onConflict:'user_id,entry_date'}));n+=W.length}
    const M=rows('measures').filter(r=>ok(r.date)&&r.name&&r.value_cm);
    if(M.length){
      const have=new Set(S.mt.map(x=>x.name)),newT=[...new Set(M.map(r=>r.name))].filter(x=>!have.has(x)).map(name=>({user_id:uid,name}));
      if(newT.length)chk(await sb.from('measurement_types').insert(newT));
      chk(await sb.from('body_entries').upsert([...new Set(M.map(r=>r.date))].map(d=>({user_id:uid,entry_date:d})),{onConflict:'user_id,entry_date'}));
      const mt=await all('measurement_types','name'),be=await all('body_entries','entry_date');
      const tid=Object.fromEntries(mt.map(x=>[x.name,x.id])),eid=Object.fromEntries(be.map(x=>[x.entry_date,x.id]));
      for(const e of new Set(M.map(r=>eid[r.date])))chk(await sb.from('body_measurements').delete().eq('entry_id',e));
      chk(await sb.from('body_measurements').insert(M.map(r=>({user_id:uid,entry_id:eid[r.date],type_id:tid[r.name],value_cm:+r.value_cm}))));
      n+=M.length;
    }
    const have=new Set(S.r.map(r=>r.run_date+'|'+(+r.distance_km)));
    const R=rows('runs').filter(r=>ok(r.date)&&r.distance_km&&r.duration_min&&!have.has(r.date+'|'+(+r.distance_km))).map(r=>({user_id:uid,run_date:r.date,distance_km:+r.distance_km,duration_s:Math.round(+r.duration_min*60)}));
    if(R.length){chk(await sb.from('runs').insert(R));n+=R.length}
    const X=rows('workouts').filter(r=>ok(r.date)&&r.exercise);
    if(X.length){
      const haveE=new Set(S.ex.map(e=>e.name)),newE=[...new Set(X.map(r=>r.exercise))].filter(x=>!haveE.has(x)).map(name=>({user_id:uid,name,kind:'weight'}));
      if(newE.length)chk(await sb.from('exercises').insert(newE));
      const exs=await all('exercises','name'),eidm=Object.fromEntries(exs.map(e=>[e.name,e.id]));
      const groups={};X.forEach(r=>{const k=[r.date,r.location||'gym',r.title||''].join('|');(groups[k]=groups[k]||[]).push(r)});
      const existing=new Set(S.wo.map(w=>[w.workout_date,w.location,w.title||''].join('|')));
      for(const [k,rs] of Object.entries(groups)){
        if(existing.has(k))continue;
        const [d,loc,title]=k.split('|');
        const w=chk(await sb.from('workouts').insert({user_id:uid,workout_date:d,location:['gym','home','outdoor'].includes(loc)?loc:'gym',title:title||null}).select().single());
        chk(await sb.from('workout_sets').insert(rs.map((r,i)=>({user_id:uid,workout_id:w.id,exercise_id:eidm[r.exercise],set_number:+r.set||i+1,reps:r.reps?+r.reps:null,weight_kg:r.weight_kg?+r.weight_kg:null,rpe:r.rpe?+r.rpe:null}))));
        n+=rs.length;
      }
    }
    const yes=v=>/^(true|1|oui|yes)$/i.test(v||'');
    const C=rows('cycle').filter(r=>ok(r.date)).map(r=>({user_id:uid,entry_date:r.date,period_start:yes(r.period_start),period_end:yes(r.period_end),flow:['none','light','medium','heavy'].includes(r.flow)?r.flow:null,mood:+r.mood||null,energy:+r.energy||null,symptoms:r.symptoms?r.symptoms.split(',').map(s=>s.trim()).filter(Boolean):[],notes:r.notes||null}));
    if(C.length){chk(await sb.from('cycle_entries').upsert(C,{onConflict:'user_id,entry_date'}));n+=C.length}
    await refresh();flash(n+' '+t('imported'));
  }catch(err){flash(err.message)}
}
