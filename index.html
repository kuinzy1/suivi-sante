    sb.from('goals').select('*').eq('active',true).order('created_at',{ascending:false}).limit(1),
    q('body_entries','entry_date'),q('runs','run_date'),q('exercises','name'),q('workouts','workout_date'),
    sb.from('workout_sets').select('*').order('set_number'),q('measurement_types','name'),sb.from('body_measurements').select('*'),q('cycle_entries','entry_date')]);

function render(){
  if(S.tab==='cycle'&&!mod('cycle'))S.tab='home';
  document.documentElement.dataset.theme=S.profile?.theme||'light';

const mk=(id,cfg)=>{const el=document.getElementById(id);if(el)S.charts[id]=new Chart(el,cfg)};

function movAvg(){
  const W=S.w.filter(e=>e.weight_kg!=null);
  return W.map(e=>{const d=tm(e.entry_date),win=W.filter(x=>tm(x.entry_date)<=d&&tm(x.entry_date)>d-7*864e5);return {d:e.entry_date,v:+e.weight_kg,m:win.reduce((a,x)=>a+ +x.weight_kg,0)/win.length}});
}
function weekStart(ds){const x=new Date(ds+'T12:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)}
function weeklyKm(){const m={};S.r.forEach(r=>{const k=weekStart(r.run_date);m[k]=(m[k]||0)+ +r.distance_km});return m}

function drawWeight(id){
  const a=movAvg();if(!a.length)return;
  const ds=[{label:wUnit(),data:a.map(x=>+kgOut(x.v).toFixed(1)),borderColor:css('--mut'),pointRadius:2.5,borderWidth:1.5,tension:.2},{label:t('trend'),data:a.map(x=>+kgOut(x.m).toFixed(1)),borderColor:css('--ac'),borderWidth:3,pointRadius:0,tension:.35}];
  if(S.goal?.target_weight_kg)ds.push({label:t('target'),data:a.map(()=>+kgOut(+S.goal.target_weight_kg).toFixed(1)),borderColor:'#d99a3d',borderDash:[6,4],pointRadius:0,borderWidth:1.5});
  mk(id,{type:'line',data:{labels:a.map(x=>fd(x.d)),datasets:ds},options:{...lineOpts,plugins:{legend:{position:'bottom',labels:{boxWidth:10}}}}});

function drawWeekly(id){
  const m=weeklyKm(),k=Object.keys(m).sort().slice(-10);if(!k.length)return;

  const by={};S.ws.filter(s=>s.exercise_id===id).forEach(s=>{(by[s.workout_id]??=[]).push(s)});
  return Object.entries(by).map(([wid,a])=>{const w=S.wo.find(x=>x.id===wid);const mw=Math.max(...a.map(s=>+s.weight_kg||0));return {d:w?.workout_date,v:mw>0?mw:Math.max(...a.map(s=>s.reps||0)),kg:mw>0}}).filter(x=>x.d).sort((a,b)=>a.d.localeCompare(b.d));

  if(!S.exSel)return;const a=exSeries(S.exSel);if(!a.length)return;

  const inR=(d,a,b)=>{const x=tm(d);return x>a&&x<=b};
  const woC=S.wo.filter(w=>inR(w.workout_date,s0,end)),rC=S.r.filter(r=>inR(r.run_date,s0,end));
  const ids=new Set(woC.map(w=>w.id));
  const vol=S.ws.filter(s=>ids.has(s.workout_id)).reduce((a,s)=>a+(s.reps||0)*(+s.weight_kg||0),0);
  const km=rC.reduce((a,r)=>a+ +r.distance_km,0);
  const wC=S.w.filter(e=>e.weight_kg!=null&&inR(e.entry_date,s0,end)),wP=S.w.filter(e=>e.weight_kg!=null&&inR(e.entry_date,p0,s0));
  const avg=a=>a.length?a.reduce((x,e)=>x+ +e.weight_kg,0)/a.length:null;
  const delta=avg(wC)!=null&&avg(wP)!=null?avg(wC)-avg(wP):null;
  const sessions=woC.length+rC.length,goalT=S.goal?.type;
  let al=.5;
  if(delta!=null){const tol=days===7?.5:1.5;al=goalT==='gain'?(delta>0?1:0):goalT==='loss'?(delta<0?1:0):Math.abs(delta)<=tol?1:0}
  const score=Math.round(40*Math.min(sessions/(days===7?3:12),1)+30*Math.min(wC.length/(days===7?3:12),1)+30*al);
  return {sessions,vol,km,delta,score};
}

function cycleInfo(){
  const st=S.cy.filter(c=>c.period_start).map(c=>c.entry_date).sort();
  if(!st.length)return null;
  const L=[];for(let i=1;i<st.length;i++){const d=Math.round((tm(st[i])-tm(st[i-1]))/864e5);if(d>=15&&d<=60)L.push(d)}
  const use=L.slice(-6),avg=use.length?Math.round(use.reduce((a,b)=>a+b,0)/use.length):null,last=st[st.length-1];
  const day=Math.floor((Date.now()-tm(last))/864e5)+1;
  if(!avg)return {day,avg:null};
  const next=addDays(last,avg),ov=addDays(next,-14);
  return {day,avg,next,f1:addDays(ov,-5),f2:addDays(ov,1)};
}

const flash=(txt,id='msg')=>{const e=document.getElementById(id);if(e)e.textContent=txt};
async function saveWeight(e){
  e.preventDefault();
  const wv=$('#wv').value,mn=$('#mn').value.trim(),mv=$('#mv').value;
  if(!wv&&!(mn&&mv))return flash(t('noData'));
  const row={user_id:S.user.id,entry_date:$('#wd').value};
  if(wv)row.weight_kg=+kgIn(+wv).toFixed(2);
  if($('#wf').value)row.body_fat_pct=+$('#wf').value;
  const {data:en,error}=await sb.from('body_entries').upsert(row,{onConflict:'user_id,entry_date'}).select().single();
  if(error)return flash(error.message);
  if(mn&&mv){
    let mt=S.mt.find(x=>x.name.toLowerCase()===mn.toLowerCase());
    if(!mt){const q=await sb.from('measurement_types').insert({user_id:S.user.id,name:mn}).select().single();if(q.error)return flash(q.error.message);mt=q.data}
    await sb.from('body_measurements').delete().eq('entry_id',en.id).eq('type_id',mt.id);
    const q=await sb.from('body_measurements').insert({user_id:S.user.id,entry_id:en.id,type_id:mt.id,value_cm:+cmIn(+mv).toFixed(1)});
    if(q.error)return flash(q.error.message);
    S.msSel=mt.id;
  }
  await loadAll();render();flash(t('saved'));return false;
}

function parseSets(str){

}
async function getEx(name,hasW){
  let ex=S.ex.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(ex)return ex;
  const q=await sb.from('exercises').insert({user_id:S.user.id,name,kind:hasW?'weight':'bodyweight'}).select().single();
  if(q.error)throw q.error;S.ex.push(q.data);return q.data;

async function saveWorkout(e){
  e.preventDefault();
  const rows=[...document.querySelectorAll('.exr')].map(r=>({name:r.querySelector('.en').value.trim(),sets:parseSets(r.querySelector('.es').value)})).filter(r=>r.name&&r.sets.length);
  if(!rows.length)return flash(t('noData'));
  try{
    const {data:w,error}=await sb.from('workouts').insert({user_id:S.user.id,workout_date:$('#od').value,location:$('#ol').value,title:$('#ot').value||null,duration_min:$('#om').value?+$('#om').value:null,notes:$('#on').value||null}).select().single();
    if(error)throw error;
    const prs=[];
    for(const r of rows){
      const ex=await getEx(r.name,r.sets.some(s=>s.w));
      const prev=Math.max(0,...S.ws.filter(s=>s.exercise_id===ex.id).map(s=>+s.weight_kg||0)),mx=Math.max(0,...r.sets.map(s=>s.w||0));
      if(prev>0&&mx>prev)prs.push(r.name+' '+fW(mx));
      const q=await sb.from('workout_sets').insert(r.sets.map((s,i)=>({user_id:S.user.id,workout_id:w.id,exercise_id:ex.id,set_number:i+1,reps:s.r,weight_kg:s.w})));
      if(q.error)throw q.error;
    }
    await loadAll();render();flash(prs.length?'🏆 '+t('pr')+': '+prs.join(', '):t('saved'));
  }catch(err){flash(err.message)}
  return false;
}

  add('measurements',S.bm.map(b=>({date:S.w.find(e=>e.id===b.entry_id)?.entry_date,name:S.mt.find(m=>m.id===b.type_id)?.name,value_cm:b.value_cm})));
  add('runs',S.r.map(r=>({date:r.run_date,distance_km:r.distance_km,duration_min:+(r.duration_s/60).toFixed(2)})));
  add('workouts',S.ws.map(s=>{const w=S.wo.find(x=>x.id===s.workout_id);return {date:w?.workout_date,location:w?.location,title:w?.title,duration_min:w?.duration_min,exercise:S.ex.find(x=>x.id===s.exercise_id)?.name,set:s.set_number,reps:s.reps,weight_kg:s.weight_kg}}).sort((a,b)=>(a.date||'').localeCompare(b.date||'')));
  add('cycle',S.cy.map(c=>({date:c.entry_date,period_start:c.period_start,period_end:c.period_end,flow:c.flow,mood:c.mood,energy:c.energy,symptoms:(c.symptoms||[]).join(';'),notes:c.notes})));
  XLSX.writeFile(wb,'suivi-sante-'+today()+'.xlsx');
}
async function importXlsx(inp){
  const f=inp.files[0];if(!f)return;
  const wb=XLSX.read(await f.arrayBuffer());
  const rows=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{raw:false}):[];
  const ok=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||''),uid=S.user.id,bool=v=>/^(true|1|yes|oui|x)$/i.test(String(v||''));
  let n=0,err=null;
  try{
    const W=rows('weight').filter(r=>ok(r.date)&&r.weight_kg).map(r=>({user_id:uid,entry_date:r.date,weight_kg:+r.weight_kg,body_fat_pct:r.body_fat_pct?+r.body_fat_pct:null}));
    if(W.length){const q=await sb.from('body_entries').upsert(W,{onConflict:'user_id,entry_date'});if(q.error)throw q.error;n+=W.length}
    const R=rows('runs').filter(r=>ok(r.date)&&r.distance_km&&r.duration_min).map(r=>({user_id:uid,run_date:r.date,distance_km:+r.distance_km,duration_s:Math.round(+r.duration_min*60)}));
    if(R.length){const q=await sb.from('runs').insert(R);if(q.error)throw q.error;n+=R.length}
    const C=rows('cycle').filter(r=>ok(r.date)).map(r=>({user_id:uid,entry_date:r.date,period_start:bool(r.period_start),period_end:bool(r.period_end),flow:['light','medium','heavy'].includes(r.flow)?r.flow:null,mood:r.mood?+r.mood:null,energy:r.energy?+r.energy:null,symptoms:(r.symptoms||'').split(';').filter(s=>SYM.includes(s)),notes:r.notes||null}));
    if(C.length){const q=await sb.from('cycle_entries').upsert(C,{onConflict:'user_id,entry_date'});if(q.error)throw q.error;n+=C.length}
    const groups={};
    rows('workouts').filter(r=>ok(r.date)&&r.exercise).forEach(r=>{(groups[[r.date,r.location||'gym',r.title||''].join('|')]??=[]).push(r)});
    for(const k in groups){
      const [d,l,ti]=k.split('|'),g=groups[k];
      const {data:w,error}=await sb.from('workouts').insert({user_id:uid,workout_date:d,location:['gym','home','outdoor'].includes(l)?l:'gym',title:ti||null,duration_min:g[0].duration_min?+g[0].duration_min:null}).select().single();
      if(error)throw error;
      const sets=[];
      for(const r of g){const ex=await getEx(r.exercise.trim(),!!r.weight_kg);sets.push({user_id:uid,workout_id:w.id,exercise_id:ex.id,set_number:+r.set||1,reps:r.reps?+r.reps:null,weight_kg:r.weight_kg?+r.weight_kg:null})}
      const q=await sb.from('workout_sets').insert(sets);if(q.error)throw q.error;n+=sets.length;
    }
  }catch(e){err=e}
  await loadAll();render();flash(err?err.message:n+' '+t('imported'));
}
init();
