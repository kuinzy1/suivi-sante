.row:last-child{border:0}
.bar{height:10px;background:var(--bg2);border-radius:8px;overflow:hidden}

.seg+.card:not(form){background:linear-gradient(135deg,#349078,#1b4f41);border:0;color:#fff;box-shadow:0 14px 30px -12px rgba(31,90,74,.6)}

main>*{animation:up .25s ease both}
@media (prefers-reduced-motion:reduce){main>*{animation:none}}
