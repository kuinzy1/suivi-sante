<style>

.inline{display:flex;gap:8px;align-items:center}.inline input{margin:0}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:616px;margin:auto;display:flex;gap:4px;padding:6px;background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:28px;box-shadow:var(--sh)}

.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);gap:8px;font-size:15px}
.row:last-child{border:0}
.bar{height:10px;background:var(--bg2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.seg+.card:not(form){background:linear-gradient(135deg,#349078,#1b4f41);border:0;color:#fff;box-shadow:0 14px 30px -12px rgba(31,90,74,.6)}
.seg+.card:not(form) h2{color:rgba(255,255,255,.75)}
.seg+.card:not(form) .big{font-size:46px}
.seg+.card:not(form) .bar{background:rgba(255,255,255,.25)}
.seg+.card:not(form) .bar i{background:#fff}
.msg{color:var(--ac);font-size:14px;font-weight:600;min-height:20px;margin:8px 0 0}
.seg{display:flex;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{background:none;color:var(--mut);margin:0;padding:9px;font-size:14px;box-shadow:none;border-radius:11px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{border:1px solid var(--bd);background:var(--bg2);border-radius:22px;padding:8px 14px;font-size:14px;color:var(--tx);transition:.15s}
.chip input{display:none}
.chip:has(input:checked){background:var(--ac);color:#fff;border-color:var(--ac)}

canvas{max-height:260px}

@media (prefers-reduced-motion:reduce){main>*{animation:none}}

const wUnit=()=>S.profile?.weight_unit||'kg',dUnit=()=>S.profile?.distance_unit||'km',lUnit=()=>S.profile?.length_unit||'cm';
const kgOut=v=>wUnit()==='lb'?v*2.20462:v,kgIn=v=>wUnit()==='lb'?v/2.20462:v;

async function all(tb,o){let out=[],from=0;for(;;){const {data,error}=await sb.from(tb).select('*').eq('user_id',S.user.id).order(o).range(from,from+999);if(error)throw error;out=out.concat(data);if(data.length<1000)return out;from+=1000}}
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e,s)=>{if(s?.user?.id!==S.user?.id)boot(s)});
  await boot(session);
}
async function boot(session){
  S.user=session?.user||null;
  if(!S.user){S.profile=null;return renderLogin()}
  try{await loadAll();render()}
  catch(e){$('#app').innerHTML=`<main><div class="card"><h2>Error</h2><p>${esc(e.message)}</p><button onclick="sb.auth.signOut()">${t('logout')}</button></div></main>`}
}
async function loadAll(){
  const [p,g]=await Promise.all([
    sb.from('profiles').select('*').eq('id',S.user.id).single(),
    sb.from('goals').select('*').eq('active',true).order('created_at',{ascending:false}).limit(1)]);
  if(p.error)throw p.error;
  S.profile=p.data;S.goal=g.data?.[0]||null;
  [S.w,S.r,S.ex,S.mt,S.bm,S.wo,S.ws,S.cy]=await Promise.all([
    all('body_entries','entry_date'),all('runs','run_date'),all('exercises','name'),all('measurement_types','name'),
    all('body_measurements','id'),all('workouts','workout_date'),all('workout_sets','id'),all('cycle_entries','entry_date')]);
  if(!S.ex.find(e=>e.id===S.chartEx))S.chartEx=S.ex[0]?.id||null;
  if(!S.mt.find(e=>e.id===S.chartMt))S.chartMt=S.mt[0]?.id||null;
}

function renderLogin(){
  document.documentElement.dataset.theme='light';
  $('#app').innerHTML=`<main><h1>Suivi Santé</h1><div class="card">
  <label>${t('email')}</label><input id="em" type="email" autocomplete="email">
  <label>${t('password')}</label><input id="pw" type="password" autocomplete="current-password">
  <button onclick="doLogin()">${t('login')}</button>
  <button class="sec" onclick="doMagic()" style="margin-top:10px">${t('magic')}</button>
  <p class="msg" id="msg"></p></div></main>`;
}
async function doLogin(){const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)flash(error.message)}
async function doMagic(){const {error}=await sb.auth.signInWithOtp({email:$('#em').value.trim(),options:{shouldCreateUser:false,emailRedirectTo:location.origin}});flash(error?error.message:t('sent'))}

const ICON={
home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
body:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 10a5 4 0 0 1 8 0M12 10l2-2"/>',

cycle:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',

function tabs(){const m=S.profile?.modules||{};return ['home','body',...((m.gym!==false||m.running!==false)?['train']:[]),...(m.cycle?['cycle']:[]),'settings']}
const nav=()=>`<nav>${tabs().map(k=>`<a class="${S.tab===k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${t(k)}</a>`).join('')}</nav>`;
function go(k){S.tab=k;render()}
function render(){
  if(!tabs().includes(S.tab))S.tab='home';
  Object.values(S.charts).forEach(c=>c.destroy());S.charts={};
  document.documentElement.dataset.theme=S.profile?.theme||'light';
  document.documentElement.lang=lang();
  Chart.defaults.color='#8a949c';Chart.defaults.font.family='-apple-system,system-ui,sans-serif';
  $('#app').innerHTML=`<main>${views[S.tab]()}</main>${nav()}`;
  ({home:()=>{drawWeight('c1');drawWeekly('c2')},body:()=>{drawWeight('c1');drawMeasure()},train:()=>{drawWeekly('c2');drawEx()},cycle:drawCycle,settings:()=>{}})[S.tab]();
}

const CO={plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:5},grid:{display:false}}}};
const CL={...CO,plugins:{legend:{position:'bottom'}}};
function mk(id,cfg){const el=document.getElementById(id);if(!el)return;S.charts[id]?.destroy();S.charts[id]=new Chart(el,cfg)}
function movAvg(){
  const L=S.w.filter(e=>e.weight_kg!=null);
  return L.map(e=>{const win=L.filter(x=>x.entry_date<=e.entry_date&&dayDiff(e.entry_date,x.entry_date)<7);return{d:e.entry_date,v:+e.weight_kg,m:win.reduce((a,x)=>a+ +x.weight_kg,0)/win.length}});
}
function weekStart(ds){const x=new Date(ds+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x.toISOString().slice(0,10)}
function weeklyKm(){const m={};S.r.forEach(r=>{const k=weekStart(r.run_date);m[k]=(m[k]||0)+ +r.distance_km});return m}
function drawWeight(id){
  const a=movAvg();if(!a.length)return;
  const ds=[{label:wUnit(),data:a.map(x=>+kgOut(x.v).toFixed(1)),borderColor:'#aab2b8',pointRadius:3,tension:.2},
    {label:t('trend'),data:a.map(x=>+kgOut(x.m).toFixed(2)),borderColor:ACC,borderWidth:3,pointRadius:0,tension:.3}];
  if(S.goal?.target_weight_kg)ds.push({label:t('target'),data:a.map(()=>+kgOut(+S.goal.target_weight_kg).toFixed(1)),borderColor:'#d99a2b',borderDash:[6,4],pointRadius:0});
  mk(id,{type:'line',data:{labels:a.map(x=>x.d),datasets:ds},options:CL});
}
function drawWeekly(id){
  const m=weeklyKm(),k=Object.keys(m).sort().slice(-12);if(!k.length)return;
  mk(id,{type:'bar',data:{labels:k,datasets:[{data:k.map(x=>+kmOut(m[x]).toFixed(1)),backgroundColor:ACC,borderRadius:6}]},options:CO});
}
function drawMeasure(){
  if(!S.chartMt)return;
  const ed=Object.fromEntries(S.w.map(e=>[e.id,e.entry_date]));
  const p=S.bm.filter(b=>b.type_id===S.chartMt&&ed[b.entry_id]).map(b=>({d:ed[b.entry_id],v:cmOut(+b.value_cm)})).sort((a,b)=>a.d.localeCompare(b.d));
  if(!p.length)return;
  mk('c3',{type:'line',data:{labels:p.map(x=>x.d),datasets:[{data:p.map(x=>+x.v.toFixed(1)),borderColor:ACC,tension:.25}]},options:CO});
}
function drawEx(){
  const ex=S.ex.find(e=>e.id===S.chartEx);if(!ex)return;
  const wd=Object.fromEntries(S.wo.map(w=>[w.id,w.workout_date])),by={};
  S.ws.filter(s=>s.exercise_id===ex.id&&wd[s.workout_id]).forEach(s=>{
    const d=wd[s.workout_id],v=ex.kind==='weight'?+s.weight_kg||0:ex.kind==='bodyweight'?+s.reps||0:+s.duration_s||0;by[d]=Math.max(by[d]||0,v)});
  const k=Object.keys(by).sort();if(!k.length)return;
  mk('c3',{type:'line',data:{labels:k,datasets:[{data:k.map(d=>+(ex.kind==='weight'?kgOut(by[d]):by[d]).toFixed(1)),borderColor:ACC,tension:.25}]},options:CO});
}
function cycleInfo(){
  const st=S.cy.filter(c=>c.period_start).map(c=>c.entry_date).sort(),L=[];
  for(let i=1;i<st.length;i++){const d=dayDiff(st[i],st[i-1]);if(d>=15&&d<=60)L.push(d)}
  const l6=L.slice(-6),avg=l6.length?l6.reduce((a,b)=>a+b,0)/l6.length:null,last=st[st.length-1]||null;
  return{last,avg,next:avg&&last?addDays(last,Math.round(avg)):null,day:last?dayDiff(today(),last)+1:null};
}
function drawCycle(){
  const L=S.cy.filter(c=>c.mood||c.energy).slice(-60);if(!L.length)return;
  mk('c4',{type:'line',data:{labels:L.map(c=>c.entry_date),datasets:[
    {label:t('mood'),data:L.map(c=>c.mood),borderColor:'#d99a2b',tension:.3,spanGaps:true},
    {label:t('energy'),data:L.map(c=>c.energy),borderColor:ACC,tension:.3,spanGaps:true}]},options:{...CL,scales:{...CL.scales,y:{min:1,max:5,ticks:{stepSize:1}}}}});
}
function summary(days){
  const from=addDays(today(),-(days-1)),inR=d=>d>=from&&d<=today();
  const wo=S.wo.filter(w=>inR(w.workout_date)),rn=S.r.filter(r=>inR(r.run_date)),ids=new Set(wo.map(w=>w.id));
  const vol=S.ws.filter(s=>ids.has(s.workout_id)).reduce((a,s)=>a+(+s.reps||0)*(+s.weight_kg||0),0);
  const km=rn.reduce((a,r)=>a+ +r.distance_km,0);
  const we=S.w.filter(e=>e.weight_kg!=null&&inR(e.entry_date));
  const dw=we.length>=2?+we[we.length-1].weight_kg- +we[0].weight_kg:null;
  const sessions=wo.length+rn.length,target=(S.profile.modules?.target_sessions||3)*days/7;
  const score=Math.round(70*Math.min(1,sessions/target)+30*Math.min(1,we.length/(3*days/7)));
  return{sessions,km,vol,dw,score};
}

}

async function refresh(){await loadAll();render()}
async function saveBody(e){
  e.preventDefault();
  const row={user_id:S.user.id,entry_date:$('#wd').value};
  if($('#wv').value)row.weight_kg=+kgIn(+$('#wv').value).toFixed(2);
  if($('#wf').value)row.body_fat_pct=+$('#wf').value;
  const ms=[...document.querySelectorAll('.mi')].filter(i=>i.value);
  if(!row.weight_kg&&!row.body_fat_pct&&!ms.length)return flash(t('noData'));
  const {data,error}=await sb.from('body_entries').upsert(row,{onConflict:'user_id,entry_date'}).select().single();
  if(error)return flash(error.message);
  for(const i of ms){
    await sb.from('body_measurements').delete().eq('entry_id',data.id).eq('type_id',i.dataset.id);
    const r=await sb.from('body_measurements').insert({user_id:S.user.id,entry_id:data.id,type_id:i.dataset.id,value_cm:+cmIn(+i.value).toFixed(2)});
    if(r.error)return flash(r.error.message);
  }
  await refresh();flash(t('saved'));return false;
}
async function addMt(){
  const n=$('#nmt').value.trim();if(!n)return;
  const {error}=await sb.from('measurement_types').insert({user_id:S.user.id,name:n});
  if(error)return flash(error.message);
  await refresh();
}
async function delMt(id){if(!confirm('?'))return;await sb.from('measurement_types').delete().eq('id',id);await refresh()}
async function saveRun(e){

  await refresh();flash(t('saved'));return false;
}
async function del(tb,id){await sb.from(tb).delete().eq('id',id);await refresh()}
function addSet(){
  const ex=$('#xe').value;if(!ex)return flash(t('noEx'));
  const r=$('#xr').value,w=$('#xw').value,p=$('#xp').value;
  S.draft.push({ex,reps:r?+r:null,w:w?+kgIn(+w).toFixed(2):null,rpe:p?+p:null});drawDraft();

function rmSet(i){S.draft.splice(i,1);drawDraft()}
function drawDraft(){const el=$('#draft');if(el)el.innerHTML=draftHtml()}
async function addEx(){
  const n=$('#nen').value.trim();if(!n)return;
  const {error}=await sb.from('exercises').insert({user_id:S.user.id,name:n,kind:$('#nek').value});
  if(error)return flash(error.message);
  await refresh();
}
async function saveWorkout(e){
  e.preventDefault();
  if(!S.draft.length)return flash(t('addSetFirst'));
  const exm=Object.fromEntries(S.ex.map(x=>[x.id,x])),prs=[];
  for(const id of new Set(S.draft.map(s=>s.ex))){
    const ex=exm[id],f=s=>ex.kind==='weight'?+s.weight_kg||0:ex.kind==='bodyweight'?+s.reps||0:+s.duration_s||0;
    const prev=Math.max(0,...S.ws.filter(s=>s.exercise_id===id).map(f));
    const now=Math.max(0,...S.draft.filter(s=>s.ex===id).map(s=>ex.kind==='weight'?+s.w||0:+s.reps||0));
    if(prev>0&&now>prev)prs.push(ex.name);
  }
  const {data:w,error}=await sb.from('workouts').insert({user_id:S.user.id,workout_date:$('#xd').value,location:$('#xl').value,title:$('#xt').value||null,duration_min:$('#xm').value?+$('#xm').value:null}).select().single();
  if(error)return flash(error.message);
  const cnt={};
  const sets=S.draft.map(s=>{const k=exm[s.ex].kind;cnt[s.ex]=(cnt[s.ex]||0)+1;
    return{user_id:S.user.id,workout_id:w.id,exercise_id:s.ex,set_number:cnt[s.ex],reps:k==='duration'?null:s.reps,weight_kg:k==='weight'?s.w:null,duration_s:k==='duration'?s.reps:null,rpe:s.rpe}});
  const r=await sb.from('workout_sets').insert(sets);
  if(r.error)return flash(r.error.message);
  S.draft=[];await refresh();
  flash(prs.length?t('prMsg')+prs.join(', '):t('saved'));return false;
}
async function saveCycle(e){
  e.preventDefault();
  const row={user_id:S.user.id,entry_date:$('#cd').value,period_start:$('#cps').checked,period_end:$('#cpe').checked,flow:$('#cf').value||null,
    symptoms:[...document.querySelectorAll('#sym input:checked')].map(i=>i.value),mood:$('#cm').value?+$('#cm').value:null,energy:$('#ce').value?+$('#ce').value:null,notes:$('#cn').value||null};
  const {error}=await sb.from('cycle_entries').upsert(row,{onConflict:'user_id,entry_date'});
  if(error)return flash(error.message);
  await refresh();flash(t('saved'));return false;
}
async function saveProfile(e){
  e.preventDefault();
  const modules={...(S.profile.modules||{}),gym:$('#mg').checked,running:$('#mr').checked,cycle:$('#mc').checked,target_sessions:+$('#ts').value||3};
  const {error}=await sb.from('profiles').update({display_name:$('#sn').value,language:$('#sl').value,weight_unit:$('#sw').value,distance_unit:$('#sd').value,length_unit:$('#su').value,theme:$('#st').value,modules}).eq('id',S.user.id);
  if(error)return alert(error.message);
  await refresh();return false;
}
async function saveGoal(e){

async function importXlsx(inp){
  const f=inp.files[0];if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer()),uid=S.user.id;let n=0;
    const rows=k=>wb.Sheets[k]?XLSX.utils.sheet_to_json(wb.Sheets[k],{raw:false}):[];
    const ok=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||''),chk=r=>{if(r.error)throw r.error;return r.data};
    const W=rows('weight').filter(r=>ok(r.date)&&r.weight_kg).map(r=>({user_id:uid,entry_date:r.date,weight_kg:+r.weight_kg,body_fat_pct:r.body_fat_pct?+r.body_fat_pct:null}));
    if(W.length){chk(await sb.from('body_entries').upsert(W,{onConflict:'user_id,entry_date'}));n+=W.length}
    const M=rows('measures').filter(r=>ok(r.date)&&r.name&&r.value_cm);
    if(M.length){
      const have=new Set(S.mt.map(x=>x.name)),newT=[...new Set(M.map(r=>r.name))].filter(x=>!have.has(x)).map(name=>({user_id:uid,name}));
      if(newT.length)chk(await sb.from('measurement_types').insert(newT));
      chk(await sb.from('body_entries').upsert([...new Set(M.map(r=>r.date))].map(d=>({user_id:uid,entry_date:d})),{onConflict:'user_id,entry_date'}));
      const mt=await all('measurement_types','name'),be=await all('body_entries','entry_date');
      const tid=Object.fromEntries(mt.map(x=>[x.name,x.id])),eid=Object.fromEntries(be.map(x=>[x.entry_date,x.id]));
      for(const e of new Set(M.map(r=>eid[r.date])))chk(await sb.from('body_measurements').delete().eq('entry_id',e));
      chk(await sb.from('body_measurements').insert(M.map(r=>({user_id:uid,entry_id:eid[r.date],type_id:tid[r.name],value_cm:+r.value_cm}))));
      n+=M.length;
    }
    const have=new Set(S.r.map(r=>r.run_date+'|'+(+r.distance_km)));
    const R=rows('runs').filter(r=>ok(r.date)&&r.distance_km&&r.duration_min&&!have.has(r.date+'|'+(+r.distance_km))).map(r=>({user_id:uid,run_date:r.date,distance_km:+r.distance_km,duration_s:Math.round(+r.duration_min*60)}));
    if(R.length){chk(await sb.from('runs').insert(R));n+=R.length}
    const X=rows('workouts').filter(r=>ok(r.date)&&r.exercise);
    if(X.length){
      const haveE=new Set(S.ex.map(e=>e.name)),newE=[...new Set(X.map(r=>r.exercise))].filter(x=>!haveE.has(x)).map(name=>({user_id:uid,name,kind:'weight'}));
      if(newE.length)chk(await sb.from('exercises').insert(newE));
      const exs=await all('exercises','name'),eidm=Object.fromEntries(exs.map(e=>[e.name,e.id]));
      const groups={};X.forEach(r=>{const k=[r.date,r.location||'gym',r.title||''].join('|');(groups[k]=groups[k]||[]).push(r)});
      const existing=new Set(S.wo.map(w=>[w.workout_date,w.location,w.title||''].join('|')));
      for(const [k,rs] of Object.entries(groups)){
        if(existing.has(k))continue;
        const [d,loc,title]=k.split('|');
        const w=chk(await sb.from('workouts').insert({user_id:uid,workout_date:d,location:['gym','home','outdoor'].includes(loc)?loc:'gym',title:title||null}).select().single());
        chk(await sb.from('workout_sets').insert(rs.map((r,i)=>({user_id:uid,workout_id:w.id,exercise_id:eidm[r.exercise],set_number:+r.set||i+1,reps:r.reps?+r.reps:null,weight_kg:r.weight_kg?+r.weight_kg:null,rpe:r.rpe?+r.rpe:null}))));
        n+=rs.length;
      }
    }
    const yes=v=>/^(true|1|oui|yes)$/i.test(v||'');
    const C=rows('cycle').filter(r=>ok(r.date)).map(r=>({user_id:uid,entry_date:r.date,period_start:yes(r.period_start),period_end:yes(r.period_end),flow:['none','light','medium','heavy'].includes(r.flow)?r.flow:null,mood:+r.mood||null,energy:+r.energy||null,symptoms:r.symptoms?r.symptoms.split(',').map(s=>s.trim()).filter(Boolean):[],notes:r.notes||null}));
    if(C.length){chk(await sb.from('cycle_entries').upsert(C,{onConflict:'user_id,entry_date'}));n+=C.length}
    await refresh();flash(n+' '+t('imported'));
  }catch(err){flash(err.message)}
}

  const m=S.profile.modules||{},td=today();
  const trained=S.wo.some(w=>w.workout_date===td)||S.r.some(r=>r.run_date===td);
  const kT=trained?(m.kcal||2500):(m.kcal_rest||m.kcal||2500),pT=m.protein||150,wT=m.water||2500;
  const meals=S.nu.filter(x=>x.entry_date===td),sum=k=>meals.reduce((a,x)=>a+(+x[k]||0),0);
  const dl=S.dl.find(x=>x.log_date===td)||{},pc=(v,x)=>Math.min(100,Math.round(v/x*100)),kc=sum('calories'),pr=sum('protein_g'),wa=dl.water_ml||0;
  return `<h1>${t('food')}</h1>${S.extraErr?`<div class="card"><p class="mut">${esc(S.extraErr)}</p></div>`:''}
  <div class="card"><h2>${t('today')}</h2><div class="big">${Math.round(kc)} <span class="mut">/ ${kT} kcal</span></div><div class="bar" style="margin:10px 0"><i style="width:${pc(kc,kT)}%"></i></div>
  <div class="grid" style="margin:0"><div><div class="mut">${t('protein')}</div><b>${Math.round(pr)} / ${pT} g</b></div><div><div class="mut">${t('carbs')} · ${t('fat')}</div><b>${Math.round(sum('carbs_g'))} g · ${Math.round(sum('fat_g'))} g</b></div></div></div>
  <div class="card"><h2>${t('water')}</h2><div class="big">${wa} <span class="mut">/ ${wT} ml</span></div><div class="bar" style="margin:10px 0"><i style="width:${pc(wa,wT)}%"></i></div>
  <div class="grid" style="margin:0"><button class="sec" onclick="addWater(250)">+250 ml</button><button class="sec" onclick="addWater(500)">+500 ml</button></div><button class="x" onclick="addWater(-250)" style="margin-top:6px">−250</button></div>
  <form class="card" onsubmit="return saveSleep(event)"><label>${t('sleep')}</label><div class="inline"><input id="fs" type="number" step="0.1" min="0" max="24" value="${dl.sleep_h??''}"><button class="small">${t('save')}</button></div></form>
  <form class="card" onsubmit="return saveMeal(event)">
  <label>${t('date')}</label><input id="fd" type="date" value="${td}" required>
  <label>${t('mealName')}</label><input id="fn">
  <div class="grid"><div><label>${t('kcal')}</label><input id="fk" type="number" inputmode="numeric"></div><div><label>${t('protein')} (g)</label><input id="fp" type="number" step="0.1" inputmode="decimal"></div>
  <div><label>${t('carbs')} (g)</label><input id="fc" type="number" step="0.1" inputmode="decimal"></div><div><label>${t('fat')} (g)</label><input id="ff" type="number" step="0.1" inputmode="decimal"></div></div>
  <button>${t('addMeal')}</button><p class="msg" id="msg"></p></form>
  <div class="card">${meals.map(x=>`<div class="row"><span>${esc(x.meal_name||'—')}</span><span class="mut">${x.calories||0} kcal · P${Math.round(x.protein_g||0)}</span><button class="x" onclick="del('nutrition_entries','${x.id}')">✕</button></div>`).join('')||`<p class="mut">${t('noData')}</p>`}</div>
  <div class="card"><h2>${t('cal7')}</h2><canvas id="c6"></canvas></div>
  <form class="card" onsubmit="return saveTargets(event)"><h2>${t('targets')}</h2>
  <label>${t('kcalT')}</label><input id="t1" type="number" value="${m.kcal||''}" placeholder="2500">
  <label>${t('kcalR')}</label><input id="t2" type="number" value="${m.kcal_rest||''}" placeholder="2200">
  <label>${t('protT')}</label><input id="t3" type="number" value="${m.protein||''}" placeholder="150">
  <label>${t('waterT')}</label><input id="t4" type="number" value="${m.water||''}" placeholder="2500">
  <button>${t('save')}</button></form>`;
};
G.drawFood=()=>{
  const ds=[...Array(7)].map((_,i)=>addDays(today(),i-6)),v=ds.map(d=>S.nu.filter(x=>x.entry_date===d).reduce((a,x)=>a+(+x.calories||0),0));
  mk('c6',{type:'bar',data:{labels:ds.map(d=>d.slice(5)),datasets:[{data:v,backgroundColor:ACC,borderRadius:6}]},options:CO});
};
G.saveMeal=async e=>{e.preventDefault();
  const n=i=>$(i).value?+$(i).value:null;
  const {error}=await sb.from('nutrition_entries').insert({user_id:S.user.id,entry_date:$('#fd').value,meal_name:$('#fn').value||null,calories:n('#fk')!=null?Math.round(n('#fk')):null,protein_g:n('#fp'),carbs_g:n('#fc'),fat_g:n('#ff')});
  if(error)return flash(error.message);await refresh();flash(t('saved'));return false};
G.addWater=async ml=>{
  const td=today(),cur=(S.dl.find(x=>x.log_date===td)||{}).water_ml||0;
  const {error}=await sb.from('daily_logs').upsert({user_id:S.user.id,log_date:td,water_ml:Math.max(0,cur+ml)},{onConflict:'user_id,log_date'});
  if(error)return alert(error.message);await refresh()};
G.saveSleep=async e=>{e.preventDefault();
  const {error}=await sb.from('daily_logs').upsert({user_id:S.user.id,log_date:today(),sleep_h:$('#fs').value?+$('#fs').value:null},{onConflict:'user_id,log_date'});
  if(error)return alert(error.message);await refresh();return false};
G.saveTargets=async e=>{e.preventDefault();
  const n=i=>$(i).value?+$(i).value:undefined;
  const modules={...(S.profile.modules||{}),kcal:n('#t1'),kcal_rest:n('#t2'),protein:n('#t3'),water:n('#t4')};
  const {error}=await sb.from('profiles').update({modules}).eq('id',S.user.id);
  if(error)return alert(error.message);await refresh();return false};
})();
</script>
<script>
(function(){
const G=window;
const N={
social:['Social','Social','Społeczność'],
goBack:['Retour','Back','Wstecz'],myProfile:['Mon profil','My profile','Mój profil'],
search:['Chercher un pseudo…','Search a username…','Szukaj nazwy użytkownika…'],go:['Chercher','Search','Szukaj'],
follow:['Suivre','Follow','Obserwuj'],unfollow:['Ne plus suivre','Unfollow','Przestań obserwować'],
following:['Abonnements','Following','Obserwowani'],followers:['Abonnés','Followers','Obserwujący'],
feed:['Fil d’activité','Activity feed','Aktywność'],
feedEmpty:['Suis des personnes pour voir leurs séances ici.','Follow people to see their workouts here.','Obserwuj osoby, aby zobaczyć ich treningi.'],
noUser:['Aucun profil public trouvé.','No public profile found.','Nie znaleziono profilu publicznego.'],
privateP:['Profil privé.','Private profile.','Profil prywatny.'],
w30:['Séances (30 j)','Workouts (30 d)','Treningi (30 dni)'],vol30:['Volume (30 j)','Volume (30 d)','Objętość (30 dni)'],km30:['Course (30 j)','Running (30 d)','Bieganie (30 dni)'],
topLifts:['Meilleures charges','Top lifts','Najlepsze ciężary'],recent:['Activité récente','Recent activity','Ostatnia aktywność'],
profEdit:['Profil public','Public profile','Profil publiczny'],username:['Pseudo (a-z, 0-9, _ .)','Username (a-z, 0-9, _ .)','Nazwa (a-z, 0-9, _ .)'],
bio:['Bio (160 car.)','Bio (160 chars)','Bio (160 znaków)'],avatar:['Avatar','Avatar','Awatar'],
isPublic:['Profil public (trouvable)','Public profile (searchable)','Profil publiczny (do znalezienia)'],
shareW:['Partager mes séances et courses','Share my workouts and runs','Udostępniaj treningi i biegi'],
privacyNote:['Poids, mensurations, repas, photos et cycle ne sont jamais partagés.','Weight, measurements, meals, photos and cycle are never shared.','Waga, pomiary, posiłki, zdjęcia i cykl nigdy nie są udostępniane.'],
dup:['Ce pseudo est déjà pris.','This username is taken.','Ta nazwa jest zajęta.'],
needUser:['Choisis un pseudo pour être public.','Pick a username to go public.','Wybierz nazwę, aby być publicznym.'],
delAcc:['Supprimer mon compte et mes données','Delete my account and data','Usuń konto i dane'],
delConfirm:['Supprimer définitivement ton compte et toutes tes données ?','Permanently delete your account and all your data?','Trwale usunąć konto i wszystkie dane?'],
setUser:['Choisis ton pseudo dans Réglages pour rejoindre la communauté.','Pick a username in Settings to join the community.','Wybierz nazwę w Ustawieniach, aby dołączyć.']
};
for(const [k,v] of Object.entries(N)){T.fr[k]=v[0];T.en[k]=v[1];T.pl[k]=v[2]}
ICON.social='<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>';
Object.assign(S,{following:[],followers:[],feed:[],errSoc:null,soc:{q:'',res:null,view:null,vd:null}});
const AV=['💪','🏋️','🏃','🏊','⚽','🚴','🧘','🔥','🦁','🐺','🦅','⭐'];
const COL=['#2f7d68','#3b82f6','#8b5cf6','#ec4899','#f59e0b','#ef4444','#14b8a6','#64748b'];
const av=p=>`<span class="av" style="background:${esc(p?.avatar_color||'#2f7d68')}">${esc(p?.avatar_emoji||'💪')}</span>`;
G.av=av;

const _load=G.loadAll;
G.loadAll=async function(){
  await _load();
  try{
    const f=await sb.from('follows').select('*');if(f.error)throw f.error;
    S.following=f.data.filter(r=>r.follower_id===S.user.id).map(r=>r.followee_id);
    S.followers=f.data.filter(r=>r.followee_id===S.user.id).map(r=>r.follower_id);
    S.errSoc=null;
  }catch(e){S.errSoc=e.message}
};
const _go=G.go;
G.go=function(k){if(k!=='social')S.soc.view=null;_go(k);if(k==='social')loadFeed()};

G.loadFeed=async function(){
  const ids=S.following;
  if(!ids.length){S.feed=[];return render()}
  const [wo,rn,pf]=await Promise.all([
    sb.from('workouts').select('*').in('user_id',ids).order('workout_date',{ascending:false}).limit(25),
    sb.from('runs').select('*').in('user_id',ids).order('run_date',{ascending:false}).limit(15),
    sb.from('profiles').select('id,username,display_name,avatar_emoji,avatar_color').in('id',ids)]);
  const W=wo.data||[],wids=W.map(w=>w.id);
  let ws=[],lk=[],ex=[];
  if(wids.length){
    const [a,b]=await Promise.all([sb.from('workout_sets').select('*').in('workout_id',wids),sb.from('workout_likes').select('*').in('workout_id',wids)]);
    ws=a.data||[];lk=b.data||[];
    const eids=[...new Set(ws.map(s=>s.exercise_id))];
    if(eids.length)ex=(await sb.from('exercises').select('id,name').in('id',eids)).data||[];
  }
  const exn=Object.fromEntries(ex.map(e=>[e.id,e.name])),us=Object.fromEntries((pf.data||[]).map(p=>[p.id,p]));
  const items=W.map(w=>{
    const ss=ws.filter(s=>s.workout_id===w.id),g={};ss.forEach(s=>{(g[s.exercise_id]=g[s.exercise_id]||[]).push(s)});
    return{type:'w',id:w.id,u:us[w.user_id],date:w.workout_date,title:w.title,loc:w.location,
      lines:Object.entries(g).map(([id,a])=>`${exn[id]||'?'} · ${a.length}×${a[0].reps??a[0].duration_s??'–'}${a[0].weight_kg!=null?' @ '+fW(Math.max(...a.map(s=>+s.weight_kg||0))):''}`),
      vol:ss.reduce((a,s)=>a+(s.set_type==='warmup'?0:(+s.reps||0)*(+s.weight_kg||0)),0),
      likes:lk.filter(l=>l.workout_id===w.id).length,liked:lk.some(l=>l.workout_id===w.id&&l.user_id===S.user.id)};
  });
  (rn.data||[]).forEach(r=>items.push({type:'r',id:r.id,u:us[r.user_id],date:r.run_date,km:r.distance_km,dur:r.duration_s}));
  S.feed=items.filter(i=>i.u).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
  render();
};
G.toggleLike=async(id,liked)=>{
  const r=liked?await sb.from('workout_likes').delete().eq('workout_id',id).eq('user_id',S.user.id):await sb.from('workout_likes').insert({workout_id:id,user_id:S.user.id});
  if(r.error)return alert(r.error.message);await loadFeed();
};
G.toggleFollow=async id=>{
  const f=S.following.includes(id);
  const r=f?await sb.from('follows').delete().eq('follower_id',S.user.id).eq('followee_id',id):await sb.from('follows').insert({follower_id:S.user.id,followee_id:id});
  if(r.error)return alert(r.error.message);
  S.following=f?S.following.filter(x=>x!==id):[...S.following,id];
  await loadFeed();
};
G.socSearch=async()=>{
  const q=$('#sq').value.trim().replace(/[%,()]/g,'');S.soc.q=q;
  if(!q){S.soc.res=null;return render()}
  const {data,error}=await sb.from('profiles').select('id,username,display_name,avatar_emoji,avatar_color,bio').eq('is_public',true).neq('id',S.user.id).not('username','is',null).or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(20);
  if(error)return alert(error.message);S.soc.res=data;render();
};
G.openProfile=async id=>{
  S.tab='social';S.soc.view=id;S.soc.vd=null;render();
  try{
    const [p,wo,rn,fr,fg]=await Promise.all([
      sb.from('profiles').select('*').eq('id',id).maybeSingle(),
      sb.from('workouts').select('*').eq('user_id',id).order('workout_date',{ascending:false}).limit(200),
      sb.from('runs').select('*').eq('user_id',id).order('run_date',{ascending:false}).limit(200),
      sb.from('follows').select('*',{count:'exact',head:true}).eq('followee_id',id),
      sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',id)]);
    const W=wo.data||[],R=rn.data||[],wids=W.slice(0,60).map(w=>w.id);
    let ws=[];if(wids.length)ws=(await sb.from('workout_sets').select('*').in('workout_id',wids)).data||[];
    const ex=(await sb.from('exercises').select('id,name').eq('user_id',id)).data||[];
    S.soc.vd={p:p.data,W,R,ws,ex,fr:fr.count||0,fg:fg.count||0};
  }catch(e){S.soc.vd={p:null,W:[],R:[],ws:[],ex:[],fr:0,fg:0}}
  if(S.soc.view===id)render();
};

function feedCard(i){
  const u=i.u;
  return `<div class="card"><div class="inline" onclick="openProfile('${u.id}')">${av(u)}<span><b>${esc(u.display_name||u.username)}</b><br><span class="mut">@${esc(u.username)} · ${i.date}</span></span></div>`+
  (i.type==='w'
    ?`<p style="margin:10px 0 4px"><b>${esc(i.title||locLabel(i.loc))}</b> <span class="mut">· ${locLabel(i.loc)}</span></p>${i.lines.map(l=>`<div class="mut">${esc(l)}</div>`).join('')}<p class="mut" style="margin:6px 0">${t('volume')} ${Math.round(kgOut(i.vol))} ${wUnit()}</p><button class="${i.liked?'':'sec'} small" onclick="toggleLike('${i.id}',${i.liked})">❤ ${i.likes}</button>`
    :`<p style="margin:10px 0 0"><b>${t('run')}</b> · ${fD(i.km)} · ${fPace(i.km,i.dur)}</p>`)+`</div>`;
}
function profileView(){
  const d=S.soc.vd,back=`<button class="sec small" style="margin-bottom:12px" onclick="S.soc.view=null;render()">← ${t('goBack')}</button>`;
  if(!d)return back+'<p class="mut">…</p>';
  if(!d.p)return back+`<div class="card"><p>${t('privateP')}</p></div>`;
  const p=d.p,me=p.id===S.user.id,from=addDays(today(),-29);
  const w30=d.W.filter(w=>w.workout_date>=from),ids=new Set(w30.map(w=>w.id));
  const vol=d.ws.filter(s=>ids.has(s.workout_id)&&s.set_type!=='warmup').reduce((a,s)=>a+(+s.reps||0)*(+s.weight_kg||0),0);
  const km=d.R.filter(r=>r.run_date>=from).reduce((a,r)=>a+ +r.distance_km,0);
  const best={};d.ws.forEach(s=>{if(s.set_type!=='warmup'&&+s.weight_kg>(best[s.exercise_id]||0))best[s.exercise_id]=+s.weight_kg});
  const exn=Object.fromEntries(d.ex.map(e=>[e.id,e.name]));
  const top=Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,w])=>`<div class="row"><span>${esc(exn[id]||'?')}</span><b>${fW(w)}</b></div>`).join('');
  const rec=d.W.slice(0,8).map(w=>`<div class="row"><span>${esc(w.title||locLabel(w.location))}</span><span class="mut">${w.workout_date}</span></div>`).join('');
  const f=S.following.includes(p.id);
  return back+`<div class="card" style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:8px">${av(p)}</div><div class="big" style="font-size:24px">${esc(p.display_name||p.username||'')}</div><div class="mut">@${esc(p.username||'')}</div>${p.bio?`<p>${esc(p.bio)}</p>`:''}<div class="mut">${d.fr} ${t('followers')} · ${d.fg} ${t('following')}</div>${me||!p.is_public?'':`<button class="${f?'sec':''}" style="margin-top:10px" onclick="toggleFollow('${p.id}').then(()=>openProfile('${p.id}'))">${f?t('unfollow'):t('follow')}</button>`}</div>
  <div class="grid" style="grid-template-columns:1fr 1fr 1fr"><div class="card"><div class="mut">${t('w30')}</div><div class="big" style="font-size:22px">${w30.length}</div></div><div class="card"><div class="mut">${t('vol30')}</div><div class="big" style="font-size:22px">${Math.round(kgOut(vol))}</div></div><div class="card"><div class="mut">${t('km30')}</div><div class="big" style="font-size:22px">${kmOut(km).toFixed(0)}</div></div></div>
  ${top?`<div class="card"><h2>${t('topLifts')}</h2>${top}</div>`:''}${rec?`<div class="card"><h2>${t('recent')}</h2>${rec}</div>`:''}`;
}
views.social=function(){
  if(S.errSoc)return `<h1>${t('social')}</h1><div class="card"><p class="mut">${esc(S.errSoc)}</p></div>`;
  if(S.soc.view)return profileView();
  const res=S.soc.res;
  const row=p=>{const f=S.following.includes(p.id);return `<div class="row" onclick="openProfile('${p.id}')"><span class="inline">${av(p)}<span><b>${esc(p.display_name||p.username)}</b><br><span class="mut">@${esc(p.username)}</span></span></span><button class="small ${f?'sec':''}" onclick="event.stopPropagation();toggleFollow('${p.id}')">${f?t('unfollow'):t('follow')}</button></div>`};
  return `<h1>${t('social')}</h1>
  <button class="sec small" style="margin-bottom:12px" onclick="openProfile('${S.user.id}')">${t('myProfile')}</button>
  <div class="grid"><div class="card"><div class="big">${S.following.length}</div><div class="mut">${t('following')}</div></div><div class="card"><div class="big">${S.followers.length}</div><div class="mut">${t('followers')}</div></div></div>
  <div class="card"><div class="inline"><input id="sq" placeholder="${esc(t('search'))}" value="${esc(S.soc.q)}"><button class="small" onclick="socSearch()">${t('go')}</button></div>${res==null?'':res.length?res.map(row).join(''):`<p class="mut">${t('noUser')}</p>`}</div>
  <h2>${t('feed')}</h2>${S.feed.length?S.feed.map(feedCard).join(''):`<div class="card"><p class="mut">${t('feedEmpty')}</p></div>`}`;
};

const _home=views.home;
views.home=function(){
  let h=_home();
  if(!S.profile.username)h=h.replace('<div class="seg">',()=>`<div class="card" onclick="go('settings')" style="cursor:pointer">👋 ${t('setUser')}</div><div class="seg">`);
  return h;
};
function profEdit(){
  const p=S.profile;
  return `<form class="card" onsubmit="return saveProf(event)"><h2>${t('profEdit')}</h2>
  <div class="inline" style="margin-bottom:10px">${av(p)}<span class="mut">${t('avatar')}</span></div>
  <div class="chips">${AV.map(e=>`<label class="chip"><input type="radio" name="ave" value="${e}" ${e===p.avatar_emoji?'checked':''}>${e}</label>`).join('')}</div>
  <div class="chips">${COL.map(c=>`<label class="chip col" style="background:${c};padding:8px 18px"><input type="radio" name="avc" value="${c}" ${c===p.avatar_color?'checked':''}>&nbsp;</label>`).join('')}</div>
  <label>${t('username')}</label><input id="pu" value="${esc(p.username)}" maxlength="20" autocapitalize="none">
  <label>${t('bio')}</label><input id="pb" value="${esc(p.bio)}" maxlength="160">
  <div class="chips"><label class="chip"><input type="checkbox" id="pp" ${p.is_public?'checked':''}>${t('isPublic')}</label><label class="chip"><input type="checkbox" id="ps" ${p.share_workouts!==false?'checked':''}>${t('shareW')}</label></div>
  <p class="mut">${t('privacyNote')}</p><button>${t('save')}</button></form>`;
}
const _settings=views.settings;
views.settings=function(){
  return _settings().replace('<form class="card" onsubmit="return saveGoal(event)">',()=>profEdit()+'<form class="card" onsubmit="return saveGoal(event)">')+
  `<button class="sec" style="margin-top:12px;color:#c0392b;border-color:#c0392b" onclick="delAccount()">${t('delAcc')}</button>`;
};
G.saveProf=async e=>{
  e.preventDefault();
  const u=$('#pu').value.trim().toLowerCase();
  if(u&&!/^[a-z0-9_.]{3,20}$/.test(u))return alert('3-20: a-z 0-9 _ .');
  if($('#pp').checked&&!u)return alert(t('needUser'));
  const {error}=await sb.from('profiles').update({username:u||null,bio:$('#pb').value||null,
    avatar_emoji:document.querySelector('input[name=ave]:checked')?.value||'💪',avatar_color:document.querySelector('input[name=avc]:checked')?.value||'#2f7d68',
    is_public:$('#pp').checked,share_workouts:$('#ps').checked}).eq('id',S.user.id);
  if(error)return alert(error.code==='23505'?t('dup'):error.message);
  await refresh();return false;
};
G.delAccount=async()=>{
  if(!confirm(t('delConfirm'))||!confirm(t('delConfirm')+' (2/2)'))return;
  const {error}=await sb.rpc('delete_my_account');if(error)return alert(error.message);
  await sb.auth.signOut();
};
})();
</script>
<script>
(function(){
const G=window;
const N={
go:['Chercher','Search','Szukaj'],
setType:['Type de série','Set type','Typ serii'],normal:['Normale','Normal','Zwykła'],warmup:['Échauffement','Warm-up','Rozgrzewka'],drop:['Drop set','Drop set','Drop set'],failure:['Échec','Failure','Do upadku'],
plateCalc:['Calculateur de disques','Plate calculator','Kalkulator talerzy'],bar:['Barre','Bar','Sztanga'],perSide:['Par côté','Per side','Na stronę'],
insights:['Tendance','Trend','Trend'],trendWeek:['Poids','Weight','Waga'],perWeek:['/sem.','/wk','/tydz.'],
heat:['Régularité (12 semaines)','Consistency (12 weeks)','Regularność (12 tygodni)'],weeks:['semaines d’affilée (objectif atteint)','weeks in a row (goal met)','tygodni z rzędu (cel osiągnięty)'],
bFirst:['🏁 1re séance','🏁 First workout','🏁 Pierwszy trening'],b10:['🔟 10 séances','🔟 10 workouts','🔟 10 treningów'],b50:['🥉 50 séances','🥉 50 workouts','🥉 50 treningów'],b100:['🥇 100 séances','🥇 100 workouts','🥇 100 treningów'],
bMar:['🏃 42 km cumulés','🏃 42 km total','🏃 42 km łącznie'],bStreak:['🔥 4 semaines','🔥 4 weeks','🔥 4 tygodnie'],
board:['Classement de la semaine','Weekly leaderboard','Ranking tygodnia'],sess:['séances','sessions','treningi'],
foodSearch:['Rechercher un aliment','Search a food','Szukaj produktu'],foodSearchPh:['Nom ou code-barres','Name or barcode','Nazwa lub kod kreskowy'],
myFoods:['Mes aliments','My foods','Moje produkty'],recentMeals:['Repas récents','Recent meals','Ostatnie posiłki'],
saveFood:['☆ Enregistrer comme aliment','☆ Save as my food','☆ Zapisz jako produkt'],grams:['Quantité en g ?','Amount in g?','Ilość w g?'],
photos:['Photos de progression','Progress photos','Zdjęcia postępów']
};
for(const [k,v] of Object.entries(N)){T.fr[k]=v[0];T.en[k]=v[1];T.pl[k]=v[2]}
Object.assign(S,{cf:[],ph:[],phUrl:{},phSel:[],board:null});

const _load=G.loadAll;
G.loadAll=async function(){
  await _load();
  try{
    S.cf=await all('custom_foods','created_at');S.ph=await all('progress_photos','photo_date');S.phUrl={};
    const last=S.ph.slice(-24);
    if(last.length){const r=await sb.storage.from('progress').createSignedUrls(last.map(p=>p.path),3600);(r.data||[]).forEach(x=>{if(x.signedUrl)S.phUrl[x.path]=x.signedUrl})}
  }catch(e){}
};

G.summary=function(days){
  const from=addDays(today(),-(days-1)),inR=d=>d>=from&&d<=today();
  const wo=S.wo.filter(w=>inR(w.workout_date)),rn=S.r.filter(r=>inR(r.run_date)),ids=new Set(wo.map(w=>w.id));
  const vol=S.ws.filter(s=>ids.has(s.workout_id)&&s.set_type!=='warmup').reduce((a,s)=>a+(+s.reps||0)*(+s.weight_kg||0),0);
  const km=rn.reduce((a,r)=>a+ +r.distance_km,0);
  const we=S.w.filter(e=>e.weight_kg!=null&&inR(e.entry_date));
  const dw=we.length>=2?+we[we.length-1].weight_kg- +we[0].weight_kg:null;
  const sessions=wo.length+rn.length,target=(S.profile.modules?.target_sessions||3)*days/7;
  const score=Math.round(70*Math.min(1,sessions/target)+30*Math.min(1,we.length/(3*days/7)));
  return{sessions,km,vol,dw,score};
};

const TAG={warmup:'W',drop:'D',failure:'F'};
G.draftHtml=function(){
  const exm=Object.fromEntries(S.ex.map(x=>[x.id,x]));
  return S.draft.map((s,i)=>`<div class="row"><span>${s.st&&TAG[s.st]?`<b class="mut">[${TAG[s.st]}]</b> `:''}${esc(exm[s.ex]?.name)}</span><span>${s.reps??'–'} × ${s.w!=null?fW(s.w):'–'}${s.rpe?' · RPE '+s.rpe:''}</span><button type="button" class="x" onclick="rmSet(${i})">✕</button></div>`).join('');
};
const _addSet=G.addSet;
G.addSet=function(){const n=S.draft.length;_addSet();if(S.draft.length>n){S.draft[S.draft.length-1].st=$('#xs')?.value||'normal';drawDraft()}};
G.saveWorkout=async function(e){
  e.preventDefault();
  if(!S.draft.length)return flash(t('addSetFirst'));
  const exm=Object.fromEntries(S.ex.map(x=>[x.id,x])),prs=[];
  for(const id of new Set(S.draft.map(s=>s.ex))){
    const ex=exm[id],f=s=>ex.kind==='weight'?+s.weight_kg||0:ex.kind==='bodyweight'?+s.reps||0:+s.duration_s||0;
    const prev=Math.max(0,...S.ws.filter(s=>s.exercise_id===id&&s.set_type!=='warmup').map(f));
    const now=Math.max(0,...S.draft.filter(s=>s.ex===id&&s.st!=='warmup').map(s=>ex.kind==='weight'?+s.w||0:+s.reps||0));
    if(prev>0&&now>prev)prs.push(ex.name);
  }
  const {data:w,error}=await sb.from('workouts').insert({user_id:S.user.id,workout_date:$('#xd').value,location:$('#xl').value,title:$('#xt').value||null,duration_min:$('#xm').value?+$('#xm').value:null}).select().single();
  if(error)return flash(error.message);
  const cnt={};
  const sets=S.draft.map(s=>{const k=exm[s.ex].kind;cnt[s.ex]=(cnt[s.ex]||0)+1;
    return{user_id:S.user.id,workout_id:w.id,exercise_id:s.ex,set_number:cnt[s.ex],reps:k==='duration'?null:s.reps,weight_kg:k==='weight'?s.w:null,duration_s:k==='duration'?s.reps:null,rpe:s.rpe,set_type:s.st||'normal'}});
  const r=await sb.from('workout_sets').insert(sets);
  if(r.error)return flash(r.error.message);
  S.draft=[];await refresh();
  flash(prs.length?t('prMsg')+prs.join(', '):t('saved'));return false;
};
G.plates=()=>{
  const lb=wUnit()==='lb',bar=+$('#plb').value,tgt=+$('#plt').value,P=lb?[45,35,25,10,5,2.5]:[25,20,15,10,5,2.5,1.25];
  let r=(tgt-bar)/2;const out=[];
  if(!tgt||r<0){$('#pcr').textContent='—';return}
  P.forEach(p=>{while(r>=p-1e-9){out.push(p);r-=p}});
  $('#pcr').textContent=(out.join(' + ')||'—')+(r>0.01?`  (+${r.toFixed(2)})`:'');
};
const _train=views.train;
views.train=function(){
  let h=_train();
  if(!h.includes('id="draft"'))return h;
  const sel=`<label>${t('setType')}</label><select id="xs">${['normal','warmup','drop','failure'].map(k=>`<option value="${k}">${t(k)}</option>`).join('')}</select>`;
  h=h.replace('<button type="button" class="sec" onclick="addSet()">',()=>sel+'<button type="button" class="sec" onclick="addSet()">');
  const lb=wUnit()==='lb',bars=lb?[45,35]:[20,15,10];
  return h+`<div class="card"><h2>${t('plateCalc')}</h2><div class="grid"><div><label>${t('bar')} (${wUnit()})</label><select id="plb" onchange="plates()">${bars.map(b=>`<option>${b}</option>`).join('')}</select></div><div><label>${t('target')} (${wUnit()})</label><input id="plt" type="number" step="0.5" inputmode="decimal" oninput="plates()"></div></div><div class="mut">${t('perSide')} :</div><div id="pcr" class="big" style="font-size:20px">—</div></div>`;
};

function weekCounts(){const m={};[...S.wo.map(w=>w.workout_date),...S.r.map(r=>r.run_date)].forEach(d=>{const k=weekStart(d);m[k]=(m[k]||0)+1});return m}
function streak(){const m=weekCounts(),tg=S.profile.modules?.target_sessions||3;let k=weekStart(today()),s=0;if((m[k]||0)<tg)k=addDays(k,-7);while((m[k]||0)>=tg){s++;k=addDays(k,-7)}return s}
function heatHtml(){
  const c={};[...S.wo.map(w=>w.workout_date),...S.r.map(r=>r.run_date)].forEach(d=>c[d]=(c[d]||0)+1);
  const start=addDays(weekStart(today()),-77),cells=[];
  for(let i=0;i<84;i++){const d=addDays(start,i),n=c[d]||0,fut=d>today();
    cells.push(`<i style="aspect-ratio:1;border-radius:4px;background:${fut?'transparent':n>=2?'var(--ac)':n===1?'color-mix(in srgb,var(--ac) 45%,transparent)':'var(--bg2)'}"></i>`)}
  return `<div style="display:grid;grid-auto-flow:column;grid-auto-columns:1fr;grid-template-rows:repeat(7,auto);gap:4px">${cells.join('')}</div>`;
}
function insight(){
  const a=movAvg();if(a.length<2)return'';
  const last=a[a.length-1],base=a.find(x=>x.d>=addDays(last.d,-28))||a[0],days=dayDiff(last.d,base.d);
  if(days<7)return'';
  const wk=(last.m-base.m)/days*7;
  return `<div class="card"><h2>${t('insights')}</h2><div>${t('trendWeek')} : <b>${wk>=0?'+':''}${kgOut(wk).toFixed(2)} ${wUnit()}${t('perWeek')}</b></div></div>`;
}
const _home=views.home;
views.home=function(){
  let h=_home();
  const tot=S.wo.length,km=S.r.reduce((a,r)=>a+ +r.distance_km,0),sk=streak();
  const bd=[['bFirst',tot>=1],['b10',tot>=10],['b50',tot>=50],['b100',tot>=100],['bMar',km>=42],['bStreak',sk>=4]]
    .map(([k,ok])=>`<span class="chip" style="${ok?'background:var(--ac);color:#fff;border-color:var(--ac)':'opacity:.45'}">${t(k)}</span>`).join('');
  const card=insight()+`<div class="card"><h2>${t('heat')}</h2>${heatHtml()}<div style="margin-top:12px">🔥 <b>${sk}</b> <span class="mut">${t('weeks')}</span></div><div class="chips" style="margin:10px 0 0">${bd}</div></div>`;
  return h.replace(/<div class="card"><h2>[^<]*<\/h2><canvas id="c1"><\/canvas><\/div>/,m=>card+m);
};

async function loadBoard(){
  if(!S.following?.length){S.board=null;return}
  const ids=[S.user.id,...S.following],from=addDays(today(),-6);
  const [w,r,p]=await Promise.all([
    sb.from('workouts').select('user_id').in('user_id',ids).gte('workout_date',from),
    sb.from('runs').select('user_id').in('user_id',ids).gte('run_date',from),
    sb.from('profiles').select('id,username,display_name,avatar_emoji,avatar_color').in('id',ids)]);
  const c={};[...(w.data||[]),...(r.data||[])].forEach(x=>c[x.user_id]=(c[x.user_id]||0)+1);
  S.board=(p.data||[]).map(u=>({u,n:c[u.id]||0})).sort((a,b)=>b.n-a.n).slice(0,8);
}
if(G.loadFeed){const _lf=G.loadFeed;G.loadFeed=async function(){try{await loadBoard()}catch(e){}return _lf()}}
if(views.social){const _soc=views.social;views.social=function(){
  let h=_soc();
  if(S.soc?.view||!S.board?.length)return h;
  const b=`<div class="card"><h2>${t('board')}</h2>${S.board.map((x,i)=>`<div class="row"><span class="inline">${i+1}. ${av(x.u)}<b>${esc(x.u.display_name||x.u.username||'')}</b></span><span>${x.n} <span class="mut">${t('sess')}</span></span></div>`).join('')}</div>`;
  return h.replace('<div class="card"><div class="inline"><input id="sq"',()=>b+'<div class="card"><div class="inline"><input id="sq"');
}}

async function addMealRow(o){const {error}=await sb.from('nutrition_entries').insert({user_id:S.user.id,entry_date:today(),...o});if(error)return alert(error.message);await refresh()}
G.offSearch=async()=>{
  const q=$('#oq').value.trim(),box=$('#ores');if(!q)return;box.innerHTML='<p class="mut">…</p>';
  try{
    let items=[];
    if(/^\d{8,14}$/.test(q)){const j=await (await fetch(`https://world.openfoodfacts.org/api/v2/product/${q}.json?fields=product_name,brands,nutriments`)).json();if(j.status===1)items=[j.product]}
    else{const j=await (await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=10&fields=product_name,brands,nutriments`)).json();items=j.products||[]}
    S.off=items.filter(p=>p.product_name).map(p=>{const n=p.nutriments||{};return{name:p.product_name+(p.brands?' · '+p.brands.split(',')[0]:''),k:+n['energy-kcal_100g']||0,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0}});
    box.innerHTML=S.off.length?S.off.map((x,i)=>`<div class="row"><span>${esc(x.name)}<br><span class="mut">${Math.round(x.k)} kcal · P${x.p.toFixed(0)} C${x.c.toFixed(0)} F${x.f.toFixed(0)} / 100 g</span></span><span><button class="x" onclick="offAdd(${i})">＋</button><button class="x" onclick="offSave(${i})">☆</button></span></div>`).join(''):`<p class="mut">${t('noData')}</p>`;
  }catch(e){box.innerHTML=`<p class="mut">${esc(e.message)}</p>`}
};
const scaled=(x,g)=>{const k=g/100;return{meal_name:x.name,calories:Math.round(x.k*k),protein_g:+(x.p*k).toFixed(1),carbs_g:+(x.c*k).toFixed(1),fat_g:+(x.f*k).toFixed(1)}};
G.offAdd=async i=>{const g=+prompt(t('grams'),'100');if(!g)return;await addMealRow(scaled(S.off[i],g))};
G.offSave=async i=>{const g=+prompt(t('grams'),'100');if(!g)return;const o=scaled(S.off[i],g);
  const {error}=await sb.from('custom_foods').insert({user_id:S.user.id,name:o.meal_name,calories:o.calories,protein_g:o.protein_g,carbs_g:o.carbs_g,fat_g:o.fat_g});
  if(error)return alert(error.message);await refresh()};
G.addCF=async id=>{const c=S.cf.find(x=>x.id===id);if(c)await addMealRow({meal_name:c.name,calories:c.calories,protein_g:c.protein_g,carbs_g:c.carbs_g,fat_g:c.fat_g})};
G.delCF=async id=>{await sb.from('custom_foods').delete().eq('id',id);await refresh()};
G.addRecent=async id=>{const x=S.nu.find(y=>y.id===id);if(x)await addMealRow({meal_name:x.meal_name,calories:x.calories,protein_g:x.protein_g,carbs_g:x.carbs_g,fat_g:x.fat_g})};
G.saveCFform=async()=>{
  const n=$('#fn').value.trim();if(!n)return;
  const v=i=>$(i).value?+$(i).value:null;
  const {error}=await sb.from('custom_foods').insert({user_id:S.user.id,name:n,calories:v('#fk')!=null?Math.round(v('#fk')):null,protein_g:v('#fp'),carbs_g:v('#fc'),fat_g:v('#ff')});
  if(error)return flash(error.message);await refresh()};
const _food=views.food;
views.food=function(){
  let h=_food();
  const rec=[...new Map([...S.nu].reverse().filter(x=>x.meal_name).map(x=>[x.meal_name,x])).values()].slice(0,6);
  const ex=`<div class="card"><h2>${t('foodSearch')}</h2><div class="inline"><input id="oq" placeholder="${esc(t('foodSearchPh'))}"><button class="small" onclick="offSearch()">${t('go')}</button></div><div id="ores"></div></div>`+
    (S.cf.length?`<div class="card"><h2>${t('myFoods')}</h2><div class="chips">${S.cf.map(c=>`<span class="chip" onclick="addCF('${c.id}')">${esc(c.name)} · ${c.calories||0} <b onclick="event.stopPropagation();delCF('${c.id}')">✕</b></span>`).join('')}</div></div>`:'')+
    (rec.length?`<div class="card"><h2>${t('recentMeals')}</h2><div class="chips">${rec.map(x=>`<span class="chip" onclick="addRecent('${x.id}')">${esc(x.meal_name)}</span>`).join('')}</div></div>`:'');
  h=h.replace('<form class="card" onsubmit="return saveMeal(event)">',()=>ex+'<form class="card" onsubmit="return saveMeal(event)">');
  return h.replace(`<button>${t('addMeal')}</button>`,m=>m+`<button type="button" class="sec" onclick="saveCFform()">${t('saveFood')}</button>`);
};

function shrink(file,max){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('image')),'image/jpeg',.8)};img.onerror=()=>rej(new Error('image'));img.src=URL.createObjectURL(file)})}
G.photoUpload=async inp=>{
  const f=inp.files[0];if(!f)return;
  try{
    const blob=await shrink(f,1080),path=`${S.user.id}/${Date.now()}.jpg`;
    let r=await sb.storage.from('progress').upload(path,blob,{contentType:'image/jpeg'});if(r.error)throw r.error;
    r=await sb.from('progress_photos').insert({user_id:S.user.id,photo_date:$('#phd').value||today(),path});if(r.error)throw r.error;
    await refresh();
  }catch(e){flash(e.message,'phm')}
};
G.selPhoto=id=>{S.phSel=S.phSel.includes(id)?S.phSel.filter(x=>x!==id):[...S.phSel,id].slice(-2);render()};
G.delPhoto=async id=>{const p=S.ph.find(x=>x.id===id);if(!p||!confirm('?'))return;await sb.storage.from('progress').remove([p.path]);await sb.from('progress_photos').delete().eq('id',id);S.phSel=S.phSel.filter(x=>x!==id);await refresh()};
function photosHtml(){
  const sel=S.phSel,last=S.ph.slice(-24).reverse();
  const cmp=sel.length===2?(()=>{const [a,b]=sel.map(id=>S.ph.find(p=>p.id===id)).filter(Boolean).sort((x,y)=>x.photo_date.localeCompare(y.photo_date));
    return a&&b?`<div class="grid" style="margin-bottom:12px">${[a,b].map(p=>`<div><img src="${S.phUrl[p.path]||''}" style="width:100%;border-radius:14px"><div class="mut" style="text-align:center">${p.photo_date}</div></div>`).join('')}</div>`:''})():'';
  return `<div class="card"><h2>${t('photos')}</h2>${cmp}
  <label>${t('date')}</label><input id="phd" type="date" value="${today()}"><input type="file" accept="image/*" onchange="photoUpload(this)"><p class="msg" id="phm"></p>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${last.map(p=>`<div style="position:relative" onclick="selPhoto('${p.id}')"><img src="${S.phUrl[p.path]||''}" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;${sel.includes(p.id)?'outline:3px solid var(--ac)':''}"><div class="mut" style="font-size:11px">${p.photo_date}</div><b style="position:absolute;top:4px;right:8px;color:#fff;text-shadow:0 1px 3px #000" onclick="event.stopPropagation();delPhoto('${p.id}')">✕</b></div>`).join('')}</div></div>`;
}
const _body=views.body;
views.body=function(){return _body()+photosHtml()};
})();
</script>
<script>init();</script>
</body>
</html>
